<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BG3 Character Roulette</title>

 

    <link rel="stylesheet" href="style.css">

</head>

 

<body>

 

<header>

 

    <h1>Baldur's Gate 3</h1>

    <h2>Character Roulette</h2>

 

    <button id="rollButton">

        🎲 Charakter würfeln

    </button>

 

</header>

 

<main>

 

<section class="player">

 

<h3>Spieler 1</h3>

 

<p><strong>Rasse:</strong> <span id="race1">-</span></p>

<p><strong>Klasse:</strong> <span id="class1">-</span></p>

<p><strong>Geschlecht:</strong> <span id="gender1">-</span></p>

 

</section>

 

 

<section class="player">

 

<h3>Spieler 2</h3>

 

<p><strong>Rasse:</strong> <span id="race2">-</span></p>

<p><strong>Klasse:</strong> <span id="class2">-</span></p>

<p><strong>Geschlecht:</strong> <span id="gender2">-</span></p>

 

</section>

 

 

<section class="guardian">

 

<h3>Guardian</h3>

 

<p><strong>Rasse:</strong> <span id="guardianRace">-</span></p>

<p><strong>Geschlecht:</strong> <span id="guardianGender">-</span></p>

 

</section>

 

</main>

 

<script src="script.js"></script>

 

</body>

</html>
