<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BG3 Character Roulette</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
</head>


<body>

<div class="background-overlay"></div>


<header class="hero">

    <div class="hero-content">

        <p class="version">
            Version 1.0
        </p>

        <h1>
            Baldur's Gate III
        </h1>

        <h2>
            Character Roulette
        </h2>

        <p class="subtitle">
            Erstelle zwei zufällige Charaktere
            für deinen nächsten Durchlauf.
        </p>


        <button id="rollButton">
            🎲 Charakter würfeln
        </button>


    </div>

</header>



<main class="container">


<section class="players-grid">



<article class="character-card">

<div class="card-header">

<h3>
Spieler 1
</h3>

<span class="badge" id="origin1">
-
</span>

</div>


<div class="card-body" id="playerOne">

<div class="attribute">
<span class="label">Bereit</span>
<span class="value">Charakter würfeln</span>
</div>

</div>

</article>





<article class="character-card">

<div class="card-header">

<h3>
Spieler 2
</h3>

<span class="badge" id="origin2">
-
</span>

</div>


<div class="card-body" id="playerTwo">

<div class="attribute">
<span class="label">Bereit</span>
<span class="value">Charakter würfeln</span>
</div>

</div>

</article>



</section>


</main>



<footer>

<p>
BG3 Character Roulette · Fanprojekt · Nicht mit Larian Studios verbunden
</p>

</footer>



<script src="script.js"></script>


</body>

</html>
